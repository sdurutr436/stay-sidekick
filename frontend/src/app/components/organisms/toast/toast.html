@if (toasts().length > 0) {
  <ul class="toast-stack" role="region" aria-label="Notificaciones">
    @for (t of toasts(); track t.id) {
      <li
        class="toast toast--{{ t.variant }}"
        role="status"
        [attr.aria-live]="ariaLive(t.variant)"
        [attr.data-variant]="t.variant"
      >
        <span class="toast__icon" aria-hidden="true">
          @switch (t.variant) {
            @case ('success') { ✓ }
            @case ('error')   { ✕ }
            @case ('warning') { ! }
            @case ('info')    { i }
          }
        </span>
        <span class="toast__mensaje">{{ t.mensaje }}</span>
        <button
          type="button"
          class="toast__cerrar"
          aria-label="Cerrar notificación"
          (click)="cerrar(t.id)"
        >
          <svg class="svg svg--xs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
            <line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
          </svg>
        </button>
      </li>
    }
  </ul>
}
