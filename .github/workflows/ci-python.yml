name: CI Python

on:
  push:
    branches: [dev-herramientas, main]
  pull_request:
    branches: [dev-herramientas, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/app

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stay_sidekick
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d stay_sidekick"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stay_sidekick
      SECRET_KEY: test-secret-key-no-usar-en-produccion
      JWT_SECRET_KEY: test-jwt-secret-key-no-usar-en-produccion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt pytest

      - name: Ejecutar tests con cobertura
        run: pytest backend/tests/ -v --cov=app --cov-config=backend/.coveragerc --cov-report=term --cov-report=html:backend/htmlcov --cov-report=xml:backend/coverage.xml --cov-fail-under=90

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/htmlcov
            backend/coverage.xml
          retention-days: 14
